name: Build South Park Bloodbath HTML5

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the game ZIP
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: bloodbath-html5-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out matching Psych Engine source
        uses: actions/checkout@v4
        with:
          repository: ShadowMario/FNF-PsychEngine
          ref: 0.6.3
          path: engine
          persist-credentials: false

      - name: Install Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.2.5

      - name: Install audio conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil

      - name: Download the uploaded game release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/game-package"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "fnf.bloodbath.RTX.fix.zip" \
            --dir "$RUNNER_TEMP/release"
          unzip -q "$RUNNER_TEMP/release/fnf.bloodbath.RTX.fix.zip" \
            -d "$RUNNER_TEMP/game-package"

      - name: Embed the Bloodbath mod and prepare HTML5 compatibility
        run: |
          python3 -m py_compile tools/prepare_html5.py tools/sanitize_chart.py tools/patch_flxgame.py tools/patch_html5_diagnostics.py
          python3 tools/prepare_html5.py \
            --engine engine \
            --package "$RUNNER_TEMP/game-package"
          python3 tools/sanitize_chart.py --engine engine
          python3 tools/patch_flxgame.py --engine engine

      - name: Install Psych Engine 0.6.3 libraries
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib install lime 8.0.1 --always
          haxelib install openfl 9.2.1 --always
          haxelib install flixel 5.2.2 --always
          haxelib install flixel-addons 3.0.2 --always
          haxelib install flixel-ui 2.5.0 --always
          haxelib install hscript 2.5.0 --always

      - name: Compile the HTML5 game
        working-directory: engine
        run: haxelib run lime build html5 -release

      - name: Prepare the Pages website
        run: |
          set -euo pipefail
          WEB_DIR="$(find engine/export/release -type f -name index.html -printf '%h\n' -quit)"
          if [ -z "$WEB_DIR" ]; then
            echo "HTML5 compilation finished without producing index.html." >&2
            find engine/export/release -maxdepth 5 -type f | head -100
            exit 1
          fi

          # Keep MP4 cutscenes out of Lime's startup preload manifest. The
          # browser-native video handler loads these files only when requested.
          VIDEO_ARCHIVE="engine/html5-video-assets"
          if [ ! -d "$VIDEO_ARCHIVE" ]; then
            echo "HTML5 video archive was not generated." >&2
            exit 1
          fi
          SOURCE_VIDEO_COUNT="$(find "$VIDEO_ARCHIVE" -type f \( -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.webm' -o -iname '*.ogv' -o -iname '*.ogg' -o -iname '*.mov' \) | wc -l)"
          if [ "$SOURCE_VIDEO_COUNT" -gt 0 ]; then
            mkdir -p "$WEB_DIR/assets/videos"
            cp -a "$VIDEO_ARCHIVE/." "$WEB_DIR/assets/videos/"
            PUBLISHED_VIDEO_COUNT="$(find "$WEB_DIR/assets/videos" -type f \( -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.webm' -o -iname '*.ogv' -o -iname '*.ogg' -o -iname '*.mov' \) | wc -l)"
            if [ "$PUBLISHED_VIDEO_COUNT" -ne "$SOURCE_VIDEO_COUNT" ]; then
              echo "MP4 cutscene copy mismatch: expected $SOURCE_VIDEO_COUNT files, found $PUBLISHED_VIDEO_COUNT." >&2
              exit 1
            fi
            echo "Published $PUBLISHED_VIDEO_COUNT MP4 cutscene videos."
          else
            echo "No MP4 cutscene files were present in the game release package."
          fi

          # Dynamic GLSL shader loading is not available in this HTML5 target.
          # The preparation script removes unused shader files before Lime
          # creates its asset manifest, so no shader URLs should be preloaded.
          if [ -d engine/assets/preload/shaders ]; then
            echo "Unsupported runtime shader directory remains before publishing." >&2
            find engine/assets/preload/shaders -type f -print
            exit 1
          fi
          if find "$WEB_DIR/assets" -type f \( -iname '*.frag' -o -iname '*.vert' -o -iname '*.frag.txt' -o -iname '*.vert.txt' \) -print -quit | grep -q .; then
            echo "Unexpected runtime shader source was included in the HTML5 asset manifest." >&2
            find "$WEB_DIR/assets" -type f \( -iname '*.frag' -o -iname '*.vert' -o -iname '*.frag.txt' -o -iname '*.vert.txt' \) -print
            exit 1
          fi

          # Publish Flixel UI's XML and images at the exact dynamic asset paths.
          # The Chart Editor and other FlxUI widgets request these files by URL
          # at runtime (not only through the compiled asset manifest).
          FLIXEL_UI_POPUP="$(find "$HOME/haxelib/flixel-ui" -type f -path '*/assets/xml/default_popup.xml' -print -quit)"
          if [ -z "$FLIXEL_UI_POPUP" ]; then
            echo "Could not locate flixel-ui 2.5.0 assets/xml/default_popup.xml in the Haxelib installation." >&2
            find "$HOME/haxelib/flixel-ui" -maxdepth 5 -type f | head -80
            exit 1
          fi
          FLIXEL_UI_ASSET_DIR="${FLIXEL_UI_POPUP%/xml/default_popup.xml}"
          mkdir -p "$WEB_DIR/assets/flixel/flixel-ui/xml" "$WEB_DIR/assets/flixel/flixel-ui/img"
          cp -a "$FLIXEL_UI_ASSET_DIR/xml/." "$WEB_DIR/assets/flixel/flixel-ui/xml/"
          cp -a "$FLIXEL_UI_ASSET_DIR/images/." "$WEB_DIR/assets/flixel/flixel-ui/img/"
          for required in default_popup.xml defaults.xml default_loading_screen.xml; do
            if [ ! -s "$WEB_DIR/assets/flixel/flixel-ui/xml/$required" ]; then
              echo "Required Flixel UI XML is missing from the published site: $required" >&2
              exit 1
            fi
          done
          if [ ! -s "$WEB_DIR/assets/flixel/flixel-ui/img/tooltip_arrow.png" ]; then
            echo "Required Flixel UI image is missing from the published site: tooltip_arrow.png" >&2
            exit 1
          fi

          # include.xml renames these assets to flixel/flixel-ui/{img,xml}
          # at the website root (not under assets/). Keep the original assets/
          # copies above as a fallback, and publish the exact Lime runtime paths.
          mkdir -p "$WEB_DIR/flixel/flixel-ui/xml" "$WEB_DIR/flixel/flixel-ui/img"
          cp -a "$FLIXEL_UI_ASSET_DIR/xml/." "$WEB_DIR/flixel/flixel-ui/xml/"
          cp -a "$FLIXEL_UI_ASSET_DIR/images/." "$WEB_DIR/flixel/flixel-ui/img/"
          for required in default_popup.xml defaults.xml default_loading_screen.xml; do
            if [ ! -s "$WEB_DIR/flixel/flixel-ui/xml/$required" ]; then
              echo "Required root Flixel UI XML is missing: flixel/flixel-ui/xml/$required" >&2
              exit 1
            fi
          done
          for required in button_arrow_down.png button_arrow_up.png button_arrow_left.png button_arrow_right.png tooltip_arrow.png; do
            if [ ! -s "$WEB_DIR/flixel/flixel-ui/img/$required" ]; then
              echo "Required root Flixel UI image is missing: flixel/flixel-ui/img/$required" >&2
              exit 1
            fi
          done

          # Publish health icons as plain static files as well as compiled Lime
          # assets. Psych loads some icon paths dynamically at runtime, so keep
          # the complete icon directory available at the exact public URL path.
          mkdir -p "$WEB_DIR/assets/images/icons"
          cp -a engine/assets/preload/images/icons/. "$WEB_DIR/assets/images/icons/"
          if [ ! -s "$WEB_DIR/assets/images/icons/icon-gf.png" ]; then
            echo "Required runtime health icon is missing: assets/images/icons/icon-gf.png" >&2
            exit 1
          fi

          # Psych's settings toggles load checkboxanim.png dynamically. Lime
          # may emit the XML atlas without publishing its PNG, so copy both
          # source files to the exact runtime URL and validate them.
          mkdir -p "$WEB_DIR/assets/images"
          for required in checkboxanim.png checkboxanim.xml; do
            SOURCE_FILE="engine/assets/preload/images/$required"
            TARGET_FILE="$WEB_DIR/assets/images/$required"
            if [ ! -s "$SOURCE_FILE" ]; then
              echo "Required Psych Engine image asset is missing from source: $SOURCE_FILE" >&2
              exit 1
            fi
            cp -f "$SOURCE_FILE" "$TARGET_FILE"
            if [ ! -s "$TARGET_FILE" ]; then
              echo "Required runtime image asset is missing from the published site: assets/images/$required" >&2
              exit 1
            fi
          done

          # Psych's character selector reads this list through a dynamic URL.
          # Ensure it exists at the exact path requested by Lime at runtime.
          CHARACTER_LIST_SOURCE="engine/assets/preload/data/characterList.txt"
          CHARACTER_LIST_TARGET="$WEB_DIR/assets/data/characterList.txt"
          if [ ! -s "$CHARACTER_LIST_SOURCE" ]; then
            echo "Required character list is missing from the Psych Engine source: $CHARACTER_LIST_SOURCE" >&2
            exit 1
          fi
          mkdir -p "$WEB_DIR/assets/data"
          cp -f "$CHARACTER_LIST_SOURCE" "$CHARACTER_LIST_TARGET"
          if [ ! -s "$CHARACTER_LIST_TARGET" ]; then
            echo "Required runtime asset is missing from the published site: assets/data/characterList.txt" >&2
            exit 1
          fi

          # Preserve the game's original shader sources as static files
          # outside Lime's generated preload manifest. HTML5 does not compile
          # Psych 0.6.3's desktop-only Lua shader API, so these files must not
          # trigger eager shader requests during game startup.
          SHADER_ARCHIVE="engine/html5-shader-source-archive"
          if [ -d "$SHADER_ARCHIVE" ]; then
            SHADER_SOURCE_COUNT="$(find "$SHADER_ARCHIVE" -type f | wc -l)"
            if [ "$SHADER_SOURCE_COUNT" -gt 0 ]; then
              mkdir -p "$WEB_DIR/shader-source-archive"
              cp -a "$SHADER_ARCHIVE/." "$WEB_DIR/shader-source-archive/"
              PUBLISHED_SHADER_COUNT="$(find "$WEB_DIR/shader-source-archive" -type f | wc -l)"
              if [ "$PUBLISHED_SHADER_COUNT" -ne "$SHADER_SOURCE_COUNT" ]; then
                echo "Shader source archive copy mismatch: expected $SHADER_SOURCE_COUNT files, found $PUBLISHED_SHADER_COUNT." >&2
                exit 1
              fi
              echo "Published $PUBLISHED_SHADER_COUNT preserved shader source files outside the Lime preload manifest."
            else
              echo "No shader source files were present in the game release package."
            fi
          else
            echo "Shader source archive was not generated." >&2
            exit 1
          fi

          mkdir -p _site
          cp -a "$WEB_DIR/." _site/
          python3 tools/patch_html5_diagnostics.py --html _site/index.html
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          SITE_BYTES="$(du -sb _site | cut -f1)"
          echo "Published site size: $SITE_BYTES bytes"
          if [ "$SITE_BYTES" -gt 1073741824 ]; then
            echo "The HTML5 site exceeds GitHub Pages' 1 GB published-site limit." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML5 build
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the HTML5 game
        id: deployment
        uses: actions/deploy-pages@v4
