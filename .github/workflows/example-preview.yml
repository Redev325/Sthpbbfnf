name: Inspect South Park stage assets

on:
  push:
    branches: [example-preview]
    paths:
      - preview-trigger.txt

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: example-preview

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Download source release and inspect shader/logo references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern "fnf.bloodbath.RTX.fix.zip" --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageDraw
          import io, re, json, os

          archive = Path(os.environ["RUNNER_TEMP"]) / "fnf.bloodbath.RTX.fix.zip"
          output = []
          thumbs = []
          with ZipFile(archive) as zf:
              names = zf.namelist()
              output.append(f"TRIGGER: {Path('preview-trigger.txt').read_text().strip()}")
              output.append(f"ARCHIVE MEMBERS: {len(names)}")

              # Locate every plausible logo/Comedy Central asset in both base assets and mod images.
              image_names = [n for n in names if n.lower().endswith((".png",".jpg",".jpeg",".webp"))]
              logo_hits = [n for n in image_names if re.search(r"comedy|central|logo|television|tv.?logo|cc.?logo|cc.?network", Path(n).name, re.I)]
              output.append("\n=== LOGO IMAGE CANDIDATES ===")
              for name in logo_hits[:200]:
                  try:
                      im=Image.open(io.BytesIO(zf.read(name)))
                      output.append(f"{name} | {im.size} | {im.mode} | {zf.getinfo(name).file_size} bytes")
                      if len(thumbs)<40:
                          im=im.convert("RGBA")
                          im.thumbnail((260,150),Image.Resampling.LANCZOS)
                          thumbs.append((name,im.copy()))
                  except Exception as e:
                      output.append(f"{name} | unreadable: {e}")
              if not logo_hits:
                  output.append("No filename candidates matched.")

              # Inspect stage creation and logo placement instructions.
              stage_files = [n for n in names if Path(n).name.lower() in ("south.lua","stage.lua") and ("/stages/" in n.lower() or "/stage/" in n.lower())]
              output.append("\n=== SOUTH STAGE LUA REFERENCES ===")
              for name in stage_files:
                  txt=zf.read(name).decode("utf-8","replace")
                  lines=txt.splitlines()
                  keep=set()
                  for i,line in enumerate(lines):
                      if re.search(r"comedy|central|logo|television|tv.?logo|cc.?logo|makeLuaSprite|makeAnimatedLuaSprite|setObjectCamera|setObjectOrder|screenCenter|scaleObject|setProperty\s*\(.*?\.(x|y)|setProperty\s*\(.*?alpha",line,re.I):
                          for j in range(max(0,i-2),min(len(lines),i+4)): keep.add(j)
                  output.append(f"FILE: {name}")
                  output.extend(f"{i+1}: {lines[i]}" for i in sorted(keep))

              # Search every packaged script/chart/config for an existing Comedy Central reference.
              output.append("\\n=== ALL TEXT REFERENCES TO COMEDY CENTRAL ===")
              text_exts=(".lua",".json",".txt",".xml",".hx",".hscript")
              for name in names:
                  if not name.lower().endswith(text_exts):
                      continue
                  try:
                      txt=zf.read(name).decode("utf-8","replace")
                  except Exception:
                      continue
                  lines=txt.splitlines()
                  matches=[(i,line.strip()) for i,line in enumerate(lines)
                           if re.search(r"comedy|central|Comedy Central\\.png",line,re.I)]
                  if matches:
                      output.append(f"FILE: {name}")
                      output.extend(f"{i+1}: {line[:500]}" for i,line in matches)

              # Include the original shader controller's event-to-effect mapping
              # so the HTML5 pass list can be optimized without removing charted effects.
              znick=[n for n in names if Path(n).name.lower()=="znickshaders.lua"]
              output.append("\\n=== ZNICK SHADER EVENT MAP ===")
              for name in znick:
                  lines=zf.read(name).decode("utf-8","replace").splitlines()
                  output.append(f"FILE: {name} ({len(lines)} lines)")
                  for i,line in enumerate(lines):
                      if re.search(r"function onEvent|function onCreate|function onUpdate|setSpriteShader|setShaderFloat|setShaderBool|camGame|camHUD|setObjectCamera|filters|shader|BarrelBlurEffect|mirrorRepeat",line,re.I):
                          output.append(f"{i+1}: {line[:500]}")

              # List all Lua shader operations and their context across Bloodbath scripts.
              lua_files=[n for n in names if n.lower().endswith(".lua") and "/mods/data/bloodbath/" in n.lower()]
              shader_call=re.compile(r"createRuntimeShader|initLuaShader|setSpriteShader|setShaderFloat|setShaderFloatArray|setShaderBool|setShaderSampler2D|setShaderInt",re.I)
              output.append("\n=== BLOODBATH SHADER CALLS ===")
              output.append(f"LUA FILES: {len(lua_files)}")
              for name in lua_files:
                  lines=zf.read(name).decode("utf-8","replace").splitlines()
                  hits=[(i,line.strip()) for i,line in enumerate(lines) if shader_call.search(line)]
                  if hits:
                      output.append(f"FILE: {name}")
                      for i,line in hits:
                          output.append(f"{i+1}: {line[:400]}")
              # Shader source archive sizes and source names.
              shader_files=[n for n in names if "/mods/shaders/" in n.lower() and n.lower().endswith((".frag",".vert"))]
              output.append("\n=== SHADER FILES ===")
              for name in sorted(shader_files,key=str.lower):
                  output.append(f"{name} | {zf.getinfo(name).file_size} bytes")

              # Asset index can help detect a logo with a generic file name.
              output.append("\n=== ALL MOD IMAGE FILES WITH DIMENSIONS ===")
              mod_images=[n for n in image_names if "/mods/images/" in n.lower()]
              for name in sorted(mod_images,key=str.lower):
                  try:
                      im=Image.open(io.BytesIO(zf.read(name)))
                      output.append(f"{name} | {im.size} | {zf.getinfo(name).file_size} bytes")
                  except Exception:
                      pass

          Path("stage-asset-inspection.txt").write_text("\n".join(output),encoding="utf-8")
          if thumbs:
              cell_w,cell_h=280,190
              cols=3
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cell_w,rows*cell_h),(24,24,24))
              draw=ImageDraw.Draw(sheet)
              for idx,(name,im) in enumerate(thumbs):
                  x=(idx%cols)*cell_w
                  y=(idx//cols)*cell_h
                  sheet.paste(im,(x,y+24),im if im.mode=="RGBA" else None)
                  draw.text((x+4,y+5),name[-38:],fill=(255,255,255))
              sheet.save("logo-candidates.jpg","JPEG",quality=82,optimize=True)

          print("\n".join(output[:160]))
          PY

      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage-asset-inspection.txt logo-candidates.jpg
          git commit -m "Inspect stage logo and shader sources" || echo "No new report changes"
          git push origin HEAD:example-preview
